name: Tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: ./scripts/test.sh
