name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
# One release at a time, so two tags pushed together cannot race to be "Latest"; a second one waits
# (GitHub keeps only one waiting run per group, so push tags one by one).
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        # A tag on an unmerged branch would publish code that main doesn't have.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "$GITHUB_REF_NAME points at a commit that is not on main; tag a commit on main instead." >&2; exit 1; }
      - name: Check the tag matches the app version
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Use the newest stable Xcode
        # Runner images also carry betas and release candidates, which sort above the stable versions.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1)
          [ -n "$xcode" ] || { echo "No stable Xcode on this runner" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: ./scripts/test.sh
      - name: Package
        run: ./scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/PortGlimpse-*.zip build/release/PortGlimpse-*.zip.sha256 --title "PortGlimpse ${GITHUB_REF_NAME#v}" --notes-file build/release/notes.md --verify-tag
