name: PortGlimpse
options:
  bundleIdPrefix: com.zewify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PortGlimpseCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  PortGlimpse:
    type: application
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: PortGlimpseCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: PortGlimpse
        CFBundleDisplayName: PortGlimpse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Zewify
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.portglimpse
        PRODUCT_NAME: PortGlimpse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  PortGlimpse:
    build:
      targets:
        PortGlimpse: all
    run:
      config: Debug
    archive:
      config: Release
